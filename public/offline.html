<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cirkle — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        text-align: center;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 2rem 1.5rem;
      }
      .ring {
        width: 56px;
        height: 56px;
        border-radius: 9999px;
        background: #1a6b3a;
        color: #ffffff;
        font-weight: 700;
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: #8b949e;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ring">C</div>
      <h1>You are offline</h1>
      <p>Cirkle needs connectivity to verify identities. Please reconnect and try again.</p>
    </div>
  </body>
</html>
